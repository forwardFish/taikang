<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>泰康计划书工作台</title>
  <style>:root {
  color-scheme: light;
  --paper: #f5f2ed;
  --white: #fffdfa;
  --ink: #282d2b;
  --muted: #686e67;
  --line: #e8e2da;
  --pine: #254c42;
  --pine-light: #eaf0e9;
  --clay: #783d35;
  --sand: #f5e8db;
  --radius: 20px;
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  font-size: 16px;
}

* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: var(--paper); }
[hidden] { display: none !important; }
button, input, select { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 3px solid #548475; outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
.wrap { width: min(1080px, 100% - 48px); margin-inline: auto; }
.topbar { background: #fdfaf6; border-bottom: 1px solid var(--line); }
.top-inner { min-height: 72px; display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 12px; font-weight: 700; }
.brand small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 2px; }
.brand-icon { width: 38px; height: 38px; border-radius: 11px; background: var(--pine); color: white; display: grid; place-items: center; }
.brand-icon svg { width: 23px; height: 23px; }
.trial { border: 1px solid #cfd9cf; border-radius: 30px; padding: 6px 12px; color: var(--pine); font-size: 12px; background: var(--pine-light); }
.workspace { padding-top: 28px; }
.steps { display: flex; align-items: center; gap: 12px; }
.steps button { display: flex; align-items: center; gap: 7px; background: transparent; color: var(--muted); border: 0; padding: 8px 0; font-size: 13px; }
.steps button span { font-size: 11px; border-radius: 50%; background: #e9e5dd; padding: 5px; min-width: 26px; }
.steps button[aria-current] { color: var(--pine); font-weight: 700; }
.steps button[aria-current] span { color: #fff; background: var(--pine); }
.step-line { width: 28px; height: 1px; background: #d2ccc2; }
.page-heading { margin: 27px 0 23px; display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.kicker { color: var(--clay); font-size: 12px; font-weight: 700; letter-spacing: .11em; }
.page-heading h1 { font-size: clamp(34px, 6vw, 55px); line-height: 1.2; margin: 6px 0 8px; letter-spacing: -.04em; }
.subtle { color: var(--muted); font-size: 14px; line-height: 1.5; }
.input-grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: 17px; align-items: start; }
.right-stack { display: grid; gap: 17px; }
.panel { padding: 21px 23px 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--white); }
.panel-heading { display: flex; align-items: center; gap: 10px; margin-bottom: 13px; }
.panel-heading h2 { font-size: 17px; }
.section-number { background: var(--pine-light); color: var(--pine); border-radius: 8px; padding: 5px 8px; font-size: 11px; font-weight: 700; }
.field { display: grid; grid-template-columns: minmax(105px, 1fr) minmax(125px, 1fr); gap: 10px; align-items: center; min-height: 58px; margin: 0; border: 0; padding: 8px 0; }
.field + .field { border-top: 1px solid var(--line); }
.field > label, .gender legend { font-size: 14px; font-weight: 600; }
.field > select, .unit-field { border: 1px solid #ddd8ce; background: #faf8f3; border-radius: 9px; height: 41px; min-width: 0; }
.field > select { padding: 0 9px; color: var(--ink); }
.unit-field { display: flex; align-items: center; padding: 0 10px; gap: 6px; }
.unit-field input { width: 100%; min-width: 0; border: 0; background: transparent; color: var(--ink); text-align: right; padding: 5px 0; font-variant-numeric: tabular-nums; }
.unit-field span { font-size: 13px; color: var(--muted); flex-shrink: 0; }
.gender { display: block; position: relative; }
.gender legend { float: left; width: calc(50% - 5px); line-height: 41px; }
.gender .segmented { margin-left: calc(50% + 5px); }
.segmented { display: flex; gap: 4px; background: #f2eee7; border-radius: 9px; padding: 3px; }
.segmented label { flex: 1; display: grid; position: relative; cursor: pointer; }
.segmented input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.segmented span { display: grid; place-items: center; min-height: 34px; border-radius: 7px; }
.segmented input:checked + span { background: var(--pine); color: #fff; }
.segmented input:focus-visible + span { outline: 3px solid #548475; outline-offset: 2px; }
.field-help { color: var(--muted); font-size: 12px; line-height: 1.55; }
#term-help { padding-bottom: 7px; }
.premium-field { border-top: 1px solid var(--line); }
.presets, .payout-options { display: flex; flex-wrap: wrap; gap: 7px; }
.presets button { color: var(--pine); background: var(--pine-light); border: 1px solid transparent; padding: 7px 9px; font-size: 12px; border-radius: 8px; }
.presets button[aria-pressed="true"] { border-color: var(--pine); font-weight: 700; }
.payout-panel { background: #fbf4ea; border-color: #ead8c8; }
.payout-panel .section-number { color: var(--clay); background: var(--sand); }
.payout-options { margin: 14px 0; }
.choice { border: 1px solid #decbba; background: #fffaf3; color: #604638; border-radius: 9px; padding: 9px 12px; min-height: 39px; font-size: 13px; }
.choice[aria-pressed="true"] { background: var(--clay); border-color: var(--clay); color: white; }
.payout-summary { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid #e8d9cb; padding-top: 12px; font-size: 13px; color: #6e554a; }
.payout-summary strong { color: var(--clay); font-size: 14px; text-align: right; }
.payout-change { margin: 0 0 10px; color: #745025; font-size: 12px; }
.assumptions { padding-bottom: 15px; }
.display-summary { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 17px; padding-block: 15px; }
.display-summary h2 { font-size: 15px; margin-bottom: 5px; }
.display-summary button { flex-shrink: 0; }
.form-actions { margin-top: 17px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--white); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.total span { font-size: 12px; color: var(--muted); display: block; }
.total strong { font-variant-numeric: tabular-nums; font-size: 21px; color: var(--pine); }
.primary, .secondary, .text-button { min-height: 41px; border-radius: 9px; padding: 9px 14px; font-size: 13px; font-weight: 600; }
.primary { border: 1px solid var(--pine); color: white; background: var(--pine); }
.primary span { margin-left: 10px; }
.secondary { color: var(--pine); background: var(--white); border: 1px solid #c6d1c8; }
.text-button { padding-inline: 8px; border: 0; background: transparent; color: var(--pine); }
.error, .inline-status { padding: 9px 12px; margin-top: 9px; border-radius: 8px; background: #fbebe5; color: #8b3026; font-size: 13px; }
.inline-status { margin: 0 0 12px; color: var(--pine); background: var(--pine-light); }
.preview-toolbar { margin: 17px 0 13px; display: flex; justify-content: space-between; gap: 10px; }
.toolbar-actions { display: flex; gap: 8px; }
.preview-share { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; font-size: 13px; color: var(--muted); }
.pdf-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 13px; padding: 11px 13px; border: 1px solid #cbd9cd; border-radius: 12px; background: var(--pine-light); }
.pdf-actions strong { display: block; color: var(--pine); font-size: 14px; }
.pdf-actions small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
.pdf-actions a { display: inline-flex; align-items: center; text-decoration: none; white-space: nowrap; }
.pdf-actions .toolbar-actions, .pdf-handoff .toolbar-actions { flex-wrap: wrap; }
.pdf-handoff { max-width: 590px; margin: 26px auto; padding: 22px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--white); }
.pdf-handoff h1 { margin: 0 0 8px; }
.pdf-handoff p { line-height: 1.6; }
.pdf-filename { overflow-wrap: anywhere; color: var(--pine); }
.pdf-handoff a { display: inline-flex; align-items: center; text-decoration: none; }
.pdf-share-address { width: 100%; min-height: 41px; }
.document { border: 1px solid var(--line); border-radius: var(--radius); background: var(--white); overflow: hidden; }
.document-heading { padding: 23px 22px 18px; background: #fbf2e9; border-bottom: 1px solid #eee0d4; }
.document-heading h1 { margin: 7px 0 10px; color: var(--clay); font-size: clamp(21px, 4vw, 36px); line-height: 1.32; }
.document-summary { font-weight: 700; color: #59342c; font-size: clamp(15px, 3.2vw, 21px); line-height: 1.5; }
.document-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
.document-meta span { color: #684d40; border: 1px solid #e6d5c5; border-radius: 7px; padding: 4px 7px; font-size: 12px; }
.lump-card { margin-top: 13px; background: #f2e3d5; border-radius: 11px; padding: 11px 13px; display: flex; justify-content: space-between; align-items: center; }
.lump-card small { display: block; color: #754e3f; font-size: 12px; }
.lump-card strong { display: block; color: var(--clay); font-size: 18px; margin-top: 3px; }
.lump-card > :last-child { text-align: right; }
.table-caption { display: flex; justify-content: space-between; gap: 9px; align-items: baseline; margin: 16px 16px 11px; }
.table-caption h2 { font-size: 16px; }
.table-caption span { color: var(--muted); font-size: 12px; text-align: right; }
.table-scroll { max-height: 555px; overflow: auto; margin: 0 12px; border-radius: 8px; border: 1px solid #e7ddd6; }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; font-size: 13px; }
th, td { padding: 9px 10px; border-bottom: 1px solid #eee7e1; }
thead th { position: sticky; top: 0; z-index: 1; min-width: 86px; font-size: 12px; text-align: right; color: #fff; background: #654037; }
thead th:first-child, tbody tr > :first-child { position: sticky; left: 0; }
thead th[data-column="year"], tbody th { text-align: center; min-width: 53px; }
thead th:first-child { z-index: 3; }
tbody th, tbody td { background: #fffdfa; }
tbody tr:nth-child(even) > * { background: #f9f6f1; }
tbody tr.key-year > * { background: #f2e2d2; }
td { text-align: right; white-space: nowrap; }
td.integer { text-align: center; }
td.emphasis { color: #873d31; font-weight: 700; }
.risk-notes { margin: 16px; color: var(--muted); font-size: 12px; line-height: 1.65; }
.risk-notes h3 { color: var(--ink); margin-bottom: 4px; font-size: 13px; }
.risk-notes p + p { margin-top: 3px; }
.footer { color: var(--muted); font-size: 11px; padding-block: 18px 24px; }
dialog { border: 0; border-radius: 21px; padding: 0; width: min(560px, 100% - 28px); background: #fffdfa; color: var(--ink); box-shadow: 0 20px 80px #161c1b30; }
dialog::backdrop { background: #222b2799; }
.sheet-heading, .sheet-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 16px 19px; }
.sheet-heading { border-bottom: 1px solid var(--line); }
.sheet-heading h2 { font-size: 19px; }
.sheet-heading p { margin-top: 4px; color: var(--muted); font-size: 13px; }
.icon-button { min-width: 36px; min-height: 36px; border-radius: 8px; border: 1px solid var(--line); background: #f7f4ef; color: var(--ink); }
.sheet-body { padding: 0 19px 12px; max-height: min(57vh, 510px); overflow: auto; }
.sheet-actions { border-top: 1px solid var(--line); }
.column-presets { display: flex; flex-wrap: wrap; gap: 2px; }
.sheet-actions .primary { flex-shrink: 0; }
.column-group { border: 0; margin: 16px 0 0; padding: 0; }
.column-group legend { font-weight: 700; font-size: 13px; margin-bottom: 6px; }
.column-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.column-item { display: flex; align-items: center; gap: 7px; min-height: 36px; padding: 5px 6px; color: #37443e; font-size: 13px; background: #f7f5ef; border-radius: 7px; cursor: pointer; }
.column-item input { accent-color: var(--pine); width: 16px; height: 16px; flex-shrink: 0; }
.order-details { margin-top: 15px; font-size: 13px; }
.order-details summary { color: var(--pine); cursor: pointer; padding: 7px 0; font-weight: 600; }
.order-details ol { padding-left: 24px; margin: 0; }
.order-details li { padding: 4px 0; }
.order-details li span { display: inline-block; min-width: 155px; }
.order-details li button { margin-left: 5px; }

@media (max-width: 680px) {
  .wrap { width: min(100% - 36px, 520px); }
  .top-inner { min-height: 61px; }
  .workspace { padding-top: 13px; }
  .page-heading { margin: 14px 0; align-items: start; }
  .page-heading .subtle { font-size: 12px; }
  .page-heading .text-button { padding: 4px 0 4px 4px; max-width: 100px; font-size: 12px; }
  .input-grid, .right-stack { grid-template-columns: 1fr; gap: 11px; }
  .panel { padding: 15px 14px 14px; border-radius: 15px; }
  .panel-heading { margin-bottom: 6px; }
  .field { min-height: 50px; padding-block: 6px; }
  .form-actions { margin-top: 10px; }
  .display-summary { margin-top: 11px; gap: 9px; }
  .display-summary .field-help { font-size: 11px; }
  .display-summary button { padding-inline: 9px; }
  .total strong { font-size: 18px; }
  .document { border-radius: 14px; }
  .document-heading { padding: 15px 13px; }
  .preview-toolbar { margin-top: 12px; }
  .toolbar-actions { gap: 5px; }
  .preview-toolbar button { padding-inline: 9px; }
  .table-scroll { margin: 0 8px; max-height: 54vh; }
  dialog { margin: auto 0 0; width: 100%; max-width: none; border-radius: 20px 20px 0 0; }
  .sheet-actions { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
}

:root {
  --paper: #f7f3ee;
  --white: #fff;
  --ink: #292228;
  --muted: #65575d;
  --line: #e4d9d9;
  --pine: #632c3c;
  --pine-light: #f4e9ed;
  --clay: #592434;
  --sand: #f6e9da;
  --radius: 14px;
}

.real-site { --topbar-height: 50px; container-type: inline-size; }
.real-site .topbar { position: relative; z-index: 1; background: var(--pine); border: 0; color: white; }
.real-site:has(#form-view:not([hidden])) .topbar { background: transparent; }
.real-site .brand small { display: none; }
.real-site .top-inner { min-height: var(--topbar-height); }
.real-site .workspace { display: grid; grid-template-columns: minmax(0, 1fr); padding-top: 0; }
.real-site #form-view { display: contents; }
.real-site .suite-heading {
  position: relative;
  isolation: isolate;
  order: -2;
  margin: 0 0 14px;
  padding: 2px 0 19px;
  color: white;
}
.real-site .suite-heading::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset-block: calc(-1 * var(--topbar-height)) 0;
  inset-inline: calc((100% - 100cqw) / 2);
  background: var(--plan-hero-image, none) center / cover no-repeat, var(--pine);
  pointer-events: none;
}
.real-site .suite-heading .kicker, .real-site .section-number { display: none; }
.real-site .suite-heading h1 { margin: 0; font-size: clamp(22px, 6vw, 34px); line-height: 1.35; letter-spacing: 0; }
.real-site .product-type { display: block; margin-top: 2px; color: #f6e7ed; font-size: .58em; font-weight: 500; }
.real-site .suite-product {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: 0 12px;
  margin-bottom: 12px;
  padding: 0 4px;
  border: 0;
  background: transparent;
}
.real-site .suite-label { margin-bottom: 0; }
.real-site #load-status { grid-column: 1 / -1; }
.real-site #load-status:empty { display: none; }
.real-site .panel-heading { min-height: 40px; margin-bottom: 2px; border-bottom: 1px solid var(--line); }
.real-site .panel-heading h2, .real-site .display-summary h2 { color: var(--clay); }
.real-site #sample { margin-left: auto; padding-inline: 4px; text-decoration: underline; text-underline-offset: 3px; }
.real-site .field > select, .real-site .unit-field, .real-site .suite-product select,
.real-site .suite-withdraw :is(input, select, button),
.real-site .withdrawal-stage input { border-color: var(--line); background: #fefcfc; }
.real-site .withdrawal-stage { background: #faf6f7; }
.real-site select {
  appearance: none;
  padding-right: 30px;
}
.real-site select:not([multiple]) {
  background-image: linear-gradient(45deg, transparent 47%, var(--pine) 50%, var(--pine) 68%, transparent 71%),
    linear-gradient(135deg, transparent 29%, var(--pine) 32%, var(--pine) 50%, transparent 53%);
  background-position: right 17px center, right 12px center;
  background-size: 5px 6px;
  background-repeat: no-repeat;
}
.real-site .field > select, .real-site .suite-product select,
.real-site .suite-withdraw select { padding-right: 30px; }
.real-site .suite-withdraw {
  grid-template-columns: minmax(64px, .65fr) minmax(156px, 1.5fr) minmax(80px, .85fr) auto;
}
.real-site .form-actions .total { min-width: 0; }
.real-site .form-actions #form-error { grid-column: 1 / -1; margin: 0; overflow-wrap: anywhere; }
.real-site .form-actions:has(#form-error:not([hidden])) { flex-wrap: wrap; }
.real-site .presets { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.real-site .presets button { border-color: var(--line); background: var(--white); }
.real-site .presets button[aria-pressed="true"] { border-color: #cba8b4; background: #e8d4db; }
.real-site .total strong { overflow-wrap: anywhere; }
.real-site .suite-table tbody tr:nth-child(even) > * { background: #faf6f7; }
.real-site .suite-table tbody tr.key-year > * { background: var(--sand); }
.secondary, .pdf-actions { border-color: #d9c4cc; }
.document-heading { background: var(--pine-light); border-color: #e6d5dc; }
.suite-table thead th { background: var(--pine); }
:is(button, a, input, select, [tabindex]):focus-visible { outline-color: #905569; }

@media (max-width: 960px) {
  .real-site .suite-withdraw { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 680px) {
  html:has(.real-site #form-view:not([hidden])) {
    scroll-padding-bottom: calc(128px + env(safe-area-inset-bottom));
  }
  .real-site { --topbar-height: 42px; }
  .real-site .suite-heading { margin-bottom: 12px; padding-bottom: 15px; }
  .real-site .suite-product { padding-inline: 6px; }
  .real-site .panel { padding: 12px 13px; }
  .real-site .field { grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); }
  .real-site .unit-field input { text-align: left; }
  .real-site .form-actions {
    position: sticky;
    bottom: 0;
    z-index: 3;
    grid-template-columns: minmax(0, 1fr);
    padding: 10px 12px max(10px, env(safe-area-inset-bottom));
    box-shadow: 0 -4px 16px #59243412;
  }
  .real-site .total { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .real-site .total strong { text-align: right; font-size: 20px; }
  .real-site #generate { width: 100%; min-height: 46px; font-size: 15px; }
}

@media (max-width: 480px), (min-width: 681px) and (max-width: 960px) {
  .real-site .suite-withdraw :is(input:first-child, select) { grid-column: 1 / -1; }
  .real-site .suite-withdraw select { grid-row: auto; }
}

@media (max-width: 360px) {
  .real-site .field { grid-template-columns: minmax(110px, .9fr) minmax(0, 1.1fr); }
}

@media (forced-colors: active) {
  .real-site select { appearance: auto; }

  <style>
    .suite-product { margin-bottom: 16px; }
    .suite-product select { width: 100%; min-height: 44px; padding: 6px 10px; color: var(--pine); border: 1px solid var(--line); border-radius: 9px; background: #faf8f3; }
    .suite-label { display: block; font-size: 14px; font-weight: 700; margin: 0 0 8px; }
    .suite-heading { margin-top: 8px; }
    .suite-heading h1 { font-size: clamp(25px, 5vw, 44px); }
    .suite-withdraw { display: grid; grid-template-columns: minmax(70px,.7fr) minmax(92px,1fr) minmax(80px,.9fr) auto; gap: 6px; margin: 9px 0; }
    .suite-withdraw :is(input,select,button) { min-width: 0; min-height: 37px; width: 100%; padding-inline: 5px; border: 1px solid var(--line); border-radius: 7px; background: #fffdfa; color: var(--pine); font-size: 13px; }
    .suite-dialog { width: min(560px, calc(100% - 22px)); border: 1px solid var(--line); padding: 18px; border-radius: 18px; background: var(--white); color: var(--ink); }
    .suite-dialog::backdrop { background: #171d1a55; }
    .suite-dialog .toolbar-actions { justify-content: space-between; flex-wrap: wrap; margin: 10px 0; }
    .suite-dialog[open] { display: flex; flex-direction: column; max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px); overflow: hidden; }
    .suite-dialog > :not(#column-choices) { flex-shrink: 0; }
    #column-choices { min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 4px 2px; }
    .suite-dialog .settings-actions { border-top: 1px solid var(--line); padding-top: 10px; margin-bottom: 0; }
    .suite-choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 6px 0 12px; }
    .suite-choices label { display: flex; align-items: start; gap: 5px; padding: 7px 4px; font-size: 14px; }
    .suite-choices input { margin: 3px 0 0; accent-color: var(--pine); }
    .suite-notes { white-space: pre-line; margin: 18px 0 24px; line-height: 1.6; font-size: 12px; color: var(--muted); }
    .suite-table { overflow: auto; max-height: 68vh; }
    .suite-table table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    .suite-table thead { position: sticky; top: 0; background: var(--pine); color: white; }
    .suite-table :is(th,td) { padding: 8px 11px; white-space: nowrap; text-align: right; font-size: 13px; border-bottom: 1px solid var(--line); }
    .suite-table tbody tr:nth-child(even) { background: #faf7f1; }
    .suite-table tbody tr.key-year { background: var(--sand); }
    .suite-table-hint { display: none; }
    .suite-withdraw-note { margin: 8px 0; }
    .withdrawal-stage { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 12px 0; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
    .withdrawal-stage-header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .withdrawal-stage-header h3 { margin: 0; color: var(--clay); font-size: 14px; }
    .withdrawal-stage label { display: grid; align-content: start; gap: 5px; min-width: 0; font-size: 13px; font-weight: 600; }
    .withdrawal-stage input { width: 100%; min-width: 0; height: 41px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--white); color: var(--ink); font-size: 16px; font-weight: 400; font-variant-numeric: tabular-nums; }
    .suite-table td.withdrawal-value { color: var(--clay); font-weight: 700; }
    @media (max-width: 680px) {
      .wrap { width: min(100% - 24px, 520px); }
      .workspace { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
      .suite-heading { flex-direction: column; align-items: flex-start; gap: 0; }
      .suite-heading .text-button { max-width: none; padding-inline: 0; }
      .field { grid-template-columns: minmax(0, 1fr) minmax(0, 1.12fr); }
      .field > select, .unit-field { height: 44px; }
      .unit-field input { height: 100%; }
      .primary, .secondary, .text-button, .presets button { min-height: 44px; }

];

const DEFAULT_COLUMNS = ['year','age','premium','annuity','dividend','account','survival'];
const SAMPLE = { age: 16, sex: 'M', term: 3, premium: 1000000, rate: 3, dividend: 100, receive: 0 };

function normalizePlanInput(value) {
  const { age, sex, term, premium, rate, dividend, receive } = value ?? {};
  if (!Number.isInteger(age) || !Number.isInteger(term) || !['M', 'F'].includes(sex) ||
      !Number.isFinite(premium) || !Number.isFinite(rate) || !Number.isFinite(dividend) ||
      ![0, 60, 70, 80].includes(receive)) {
    throw new Error('请检查投保年龄、缴费期间、保费和演示参数。');
  }
  return { age, sex, term, premium, rate, dividend, receive };
}

function termLabel(term) {
  return term === 1 ? '趸交' : `${term}年交`;
}

function caseFor(data, age, sex, term) {
  return data.cases[`${age}${sex}${term}`];
}

function termsFor(data, age, sex) {
  return Object.keys(data.terms).map(Number).filter(term => caseFor(data, age, sex, term));
}

function payoutChoices(data, age, sex, term) {
  const selected = caseFor(data, age, sex, term);
  return selected ? Object.keys(selected[1]).map(Number) : [];
}

function annualizedReturn(premiums, benefit) {
  if (!(benefit > 0)) return null;
  const balance = rate => premiums.reduce(
    (value, premium, i) => value - premium * (1 + rate) ** (premiums.length - i), benefit,
  );
  let low = -1;
  let high = 1;
  while (balance(high) > 0 && high < 1000000) high *= 2;
  for (let i = 0; i < 54; i++) {
    const mid = (low + high) / 2;
    if (balance(mid) > 0) low = mid;
    else high = mid;
  }
  return (low + high) / 2;
}

function calculate(data, input) {
  const { age, sex, term, premium, rate, dividend, receive, withdrawals = [] } = input;
  const selected = caseFor(data, age, sex, term);
  if (!selected) throw new Error('请选择有效的投保年龄、性别和缴费期间。');
  if (!(premium > 0) || !Number.isSafeInteger(Math.round(premium * 100))) throw new Error('请输入有效的首年保费。');
  if (!Number.isFinite(rate) || rate < 1 || rate > 3) throw new Error('账户演示利率请输入 1% 至 3%。');
  if (!Number.isFinite(dividend) || dividend < 0) throw new Error('请输入有效的分红演示水平。');
  const [basicRate, factors, sourceRows] = selected;
  if (receive && !factors[receive]) throw new Error('这个投保组合没有所选领取年龄，请重新选择。');
  for (const { year } of withdrawals) {
    if (year > sourceRows.length) throw new Error(`第 ${year} 年超出本方案的演算年度。`);
  }
  const withdrawalByYear = new Map(withdrawals.map(({ year, amount }) => [year, amount]));

  const basic = basicRate * premium / 1000;
  const factor = receive ? factors[receive] : 0;
  const lumpAmount = basic * factor;
  const scale = premium / 10000;
  let paid = 0;
  let paidYears = 0;
  let previousDividend = 0;
  let previousAccount = 0;
  let initialTransfers = 0;
  const payments = [];
  const rows = sourceRows.map(([sourcePremium, , sourceDividend, sourceAnnuity, guaranteeDeath, death, cash], index) => {
    const year = index + 1;
    const startAge = age + index;
    const ended = Boolean(receive && startAge >= receive);
    const payment = sourcePremium * scale;
    const annuity = ended ? 0 : sourceAnnuity * scale;
    const lumpSum = startAge === receive && receive ? lumpAmount : 0;
    const yearEndDividend = ended ? 0 : sourceDividend * scale * dividend / 100;
    const mainCash = ended ? 0 : cash * scale;
    const mainDeath = ended ? 0 : (death + guaranteeDeath) * scale;
    const transfer = annuity + lumpSum + previousDividend;
    if (year <= 6) initialTransfers += transfer;
    const bonus = year < 6 ? 0 : (year === 6 ? initialTransfers : transfer) * data.transferFee;
    // 原表当年展示领取金额，下一年度万能账户公式扣减上一年度领取。
    const priorWithdrawal = withdrawalByYear.get(year - 1) ?? 0;
    const withdrawal = withdrawalByYear.get(year) ?? 0;
    const account = (previousAccount + transfer - transfer * data.transferFee) * (1 + rate / 100) + bonus - priorWithdrawal;
    if (withdrawal > account + 1e-7) {
      throw new Error(`第 ${year} 年的部分领取金额超过万能账户价值（${formatValue(account)} 元）。`);
    }
    const fee = data.surrenderFees[Math.min(index, data.surrenderFees.length - 1)];
    const accountCash = account * (1 - fee);
    paid += payment;
    paidYears += paid;
    payments.push(payment);

    // 原表 AI 列在一次性领取前一年度使用基本保险金额，其他适用年份取下一年度的年金。
    let nextBenefit = 0;
    if (receive && startAge === receive - 1) nextBenefit = basic;
    else if (!ended && startAge + 1 < Math.max(age, 60) + 25) {
      nextBenefit = (sourceRows[index + 1]?.[3] || 0) * scale;
    }
    const survival = mainCash + accountCash + yearEndDividend + nextBenefit;
    const row = {
      year, age: startAge, endAge: startAge + 1, premium: payment, paid,
      annuity, lumpSum, dividend: previousDividend, yearEndDividend,
      cash: mainCash, mainDeath, transfer, bonus, withdrawal, account, accountCash, survival,
      death: account + yearEndDividend + mainDeath,
      simpleRate: (survival - paid) / paidYears,
      irr: annualizedReturn(payments, survival),
    };
    previousDividend = yearEndDividend;
    previousAccount = account;
    return row;
  });
  if (!rows.every(row => Object.values(row).every(value => value === null || Number.isFinite(value) && Math.abs(value) <= Number.MAX_SAFE_INTEGER))) {
    throw new Error('这组输入超出了网页可演算的数值范围。');
  }
  return { input: { ...input }, rows, basic, factor, lumpAmount, totalPremium: paid };
}

function formatValue(value, kind) {
  if (value == null) return '—';
  if (typeof value === 'string') return value;
  if (kind === 'percent') return `${(value * 100).toFixed(2)}%`;
  if (kind === 'integer') return String(value);
  if (kind === 'withdrawal') return value.toLocaleString('zh-CN', { maximumFractionDigits: 2 });
  return Math.round(value).toLocaleString('zh-CN');
}

function plannedWithdrawalYears(input) {
  const years = new Set(input.withdrawals?.filter(item => item.amount > 0).map(item => item.year));
  for (const { from, to } of input.withdrawalStages ?? []) {
    for (let year = from; year <= to; year++) years.add(year);
  }
  return years;
}


function planHeadline(plan) {
  const { age, sex, premium, term } = plan.input;
  const amount = premium % 10000 === 0 ? `${premium / 10000}万元` : `${formatValue(premium)}元`;
  return `${age}岁${sex === 'M' ? '男' : '女'}　${term === 1 ? '趸交' : '每年'}${amount}${term === 1 ? '' : `　${termLabel(term)}`}`;
}

function planPdfFilename(plan) {
  const { age, sex, term, receive } = plan.input;
  const receiveSuffix = plan.factor ? `_${receive}岁领取` : '';
  return `${plan.shortTitle ?? '幸福享裕'}_${age}岁${sex === 'M' ? '男' : '女'}_${termLabel(term)}${receiveSuffix}_逐年.pdf`;
}

function fit(ctx, text, width, size, minimum = 10) {
  const family = '"Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif';
  do { ctx.font = `${size}px ${family}`; if (ctx.measureText(text).width <= width) break; } while (--size >= minimum);
}

function wrap(ctx, text, width) {
  const lines = [];
  let line = '';
  for (const char of text) {
    if (line && ctx.measureText(line + char).width > width) { lines.push(line); line = char; }
    else line += char;
  }
  if (line) lines.push(line);
  return lines;
}

const EMPTY_PDF_COLUMNS = '所选项目没有可展示的数据，请在「展示项目」里选择其他列。';

function pdfCell(row, column) {
  const value = row[column.key];
  if (typeof value === 'string') return /^[\s—–-]*$/.test(value) ? '' : value.trim();
  return Number.isFinite(value) && (value !== 0 || column.kind === 'integer')
    ? formatValue(value, column.kind) : '';
}

function visiblePdfColumns(columns, rows) {
  return columns.filter(column => rows.some(row => pdfCell(row, column) !== ''));
}

function pdfPageLayout(columnCount) {
  if (columnCount > 12) return { width: 1588, height: 1123, pageSize: [1190.55, 841.89] };
  if (columnCount > 9) return { width: 1123, height: 794, pageSize: [841.89, 595.28] };
  return { width: 794, height: 1123, pageSize: [595.28, 841.89] };
}

function pdfColumnWidths(ctx, columns, values, gridWidth) {
  fit(ctx, '', gridWidth, 12);
  const desired = columns.map((column, i) => {
    const baseline = column.kind === 'integer' ? 48 : 64;
    return Math.max(baseline, ...values.map(row => ctx.measureText(row[i]).width + 12));
  });
  const desiredWidth = desired.reduce((sum, width) => sum + width, 0);
  return desired.map(width => width / desiredWidth * gridWidth);
}

async function drawPlanPages(plan, columns, rows, createPage) {
  const title = plan.productTitle ?? PRODUCT;
  const { width, height, pageSize } = pdfPageLayout(columns.length);
  const left = 34;
  const gridWidth = width - 2 * left;
  const tableTop = plan.factor ? 167 : 146;
  const headerHeight = 48;
  const rowHeight = 18;
  const capacity = Math.floor((height - 96 - tableTop - headerHeight) / rowHeight);
  const pageCount = Math.ceil(rows.length / capacity);
  const rowsPerPage = Math.ceil(rows.length / pageCount);
  const values = rows.map(row => columns.map(column => pdfCell(row, column)));
  const firstAnnuity = plan.rows.find(row => row.annuity > 0)?.year;
  const withdrawalYears = plannedWithdrawalYears(plan.input);
  let pageNumber = 0;

  for (let offset = 0; offset < rows.length; offset += rowsPerPage) {
    const { ctx, finish } = createPage(width, height, pageSize);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, width, height);
    ctx.fillStyle = '#632c3c';
    ctx.fillRect(left, 29, 33, 4);
    fit(ctx, title, gridWidth, 29);
    ctx.fillText(title, left, 56);
    ctx.fillStyle = '#65575d';
    const subtitle = `利益演示试用版　数据版本 ${plan.version ?? '26.07'}　金额单位 元`;
    fit(ctx, subtitle, gridWidth, 12);
    ctx.fillText(subtitle, left, 83);

    ctx.fillStyle = '#f4e9ed';
    ctx.fillRect(left, 99, gridWidth, plan.factor ? 61 : 40);
    ctx.fillStyle = '#592434';
    const summary = `${planHeadline(plan)}　总保费 ${formatValue(plan.totalPremium)} 元`;
    fit(ctx, summary, gridWidth - 24, 15);
    ctx.fillText(summary, left + 12, 112);
    const assumptions = plan.assumptions ?? `账户演示利率 ${plan.input.rate}%　分红演示水平 ${plan.input.dividend}%${plan.factor ? `　一次性领取 ${plan.input.receive}岁` : ''}`;
    fit(ctx, assumptions, gridWidth - 24, 12);
    ctx.fillText(assumptions, left + 12, 129);
    if (plan.factor) {
      const payout = `一次性领取演示金额 ${formatValue(plan.lumpAmount)} 元　基本保险金额 × ${plan.factor} 倍`;
      fit(ctx, payout, gridWidth - 24, 12);
      ctx.fillText(payout, left + 12, 148);
    }

    const widths = pdfColumnWidths(ctx, columns, values, gridWidth);
    ctx.fillStyle = '#632c3c';
    ctx.fillRect(left, tableTop, gridWidth, headerHeight);
    let x = left;
    for (const [i, column] of columns.entries()) {
      ctx.fillStyle = '#ffffff';
      fit(ctx, '', widths[i], 12);
      const lines = wrap(ctx, column.label, widths[i] - 8);
      ctx.textAlign = 'center';
      lines.forEach((line, j) => ctx.fillText(line, x + widths[i] / 2, tableTop + headerHeight / 2 + (j - (lines.length - 1) / 2) * 13));
      x += widths[i];
    }
    const batch = rows.slice(offset, offset + rowsPerPage);
    for (const [i, row] of batch.entries()) {
      const y = tableTop + headerHeight + i * rowHeight;
      const highlight = row.lumpSum > 0 || row.year === firstAnnuity || withdrawalYears.has(row.year);
      ctx.fillStyle = highlight ? '#f6e9da' : i % 2 ? '#faf6f7' : '#ffffff';
      ctx.fillRect(left, y, gridWidth, rowHeight);
      x = left;
      for (const [j, column] of columns.entries()) {
        const value = values[offset + i][j];
        if (!value) {
          x += widths[j];
          continue;
        }
        const isAccent = ['survival', 'lumpSum'].includes(column.key) || column.kind === 'withdrawal';
        ctx.fillStyle = isAccent ? '#592434' : '#292228';
        ctx.textAlign = column.kind === 'integer' ? 'center' : 'right';
        fit(ctx, value, widths[j] - 8, 12, 8);
        ctx.fillText(value, column.kind === 'integer' ? x + widths[j] / 2 : x + widths[j] - 5, y + rowHeight / 2);
        x += widths[j];
      }
    }
    ctx.strokeStyle = '#e4d9d9';
    const bottom = tableTop + headerHeight + batch.length * rowHeight;
    ctx.drawRule(left, width - left, bottom);
    ctx.fillStyle = '#65575d';
    ctx.textAlign = 'left';
    let noteY = height - 75;
    for (const note of plan.pdfNotes ?? RISK_NOTES) {
      fit(ctx, '', gridWidth, 11);
      for (const line of wrap(ctx, note, gridWidth)) { ctx.fillText(line, left, noteY); noteY += 13; }
    }
    ctx.textAlign = 'right';
    ctx.fillText(`${++pageNumber} / ${pageCount}`, width - left, height - 23);

    await finish();
  }
}

async function exportPlanPdf(plan, columns, rows) {
  const pdf = await globalThis.PDFLib.PDFDocument.create();
  pdf.setTitle(`${plan.productTitle ?? PRODUCT} 利益演示`);
  await drawPlanPages(plan, columns, rows, (width, height, pageSize) => {
    const canvas = document.createElement('canvas');
    canvas.width = width * 2;
    canvas.height = height * 2;
    const ctx = canvas.getContext('2d');
    ctx.scale(2, 2);
    ctx.textBaseline = 'middle';
    ctx.drawRule = (from, to, y) => {
      ctx.beginPath();
      ctx.moveTo(from, y);
      ctx.lineTo(to, y);
      ctx.stroke();
    };
    return { ctx, async finish() {
      const image = await pdf.embedJpg(canvas.toDataURL('image/jpeg', 0.95));
      const page = pdf.addPage(pageSize);
      page.drawImage(image, { x: 0, y: 0, width: page.getWidth(), height: page.getHeight() });
    } };
  });
  return pdf.save();
}

};
const XINGFU_B_COLUMNS = COLUMNS.filter(({ key }) => key !== 'mainDeath').map(column => ({

function calculateXingfuB(data, input, withdrawals) {
  const { age, sex, term, premium, rate, dividend, receive } = normalizePlanInput(input);
  const selected = caseFor(data, age, sex, term);
  if (!selected) throw new Error('请选择有效的投保年龄、性别和缴费期间。');
  if (!(premium > 0) || !Number.isSafeInteger(Math.round(premium * 100))) throw new Error('请输入有效的首年保费。');
  if (rate < 1 || rate > 3) throw new Error('账户演示利率请输入 1% 至 3%。');
  if (dividend < 0) throw new Error('请输入有效的分红演示水平。');
  const [basicRate, factors, sourceRows] = selected;
  if (receive && !factors[receive]) throw new Error('这个投保组合没有所选领取年龄，请重新选择。');
  for (const { year } of withdrawals) {
    if (year > sourceRows.length) throw new Error(`第 ${year} 年超出本方案的演算年度。`);
  }
  const withdrawalByYear = new Map(withdrawals.map(({ year, amount }) => [year, amount]));
  const basic = basicRate * premium / 1000;
  const factor = receive ? factors[receive] : 0;
  const lumpAmount = basic * factor;
  const scale = premium / 10000;
  let paid = 0;
  let previousDividend = 0;
  let previousAccount = 0;
  let initialTransfers = 0;
  const payments = [];
  const rows = sourceRows.map(([sourcePremium, sourceDividend, sourceAnnuity, sourceDeath, sourceCash], index) => {
    const year = index + 1;
    const startAge = age + index;
    const endAge = startAge + 1;
    const ended = receive > 0 && startAge >= receive;
    const payment = sourcePremium * scale;
    const annuity = ended ? 0 : sourceAnnuity * scale;
    const lumpSum = receive && startAge === receive ? lumpAmount : 0;
    const yearEndDividend = ended ? 0 : sourceDividend * scale * dividend / 100;
    const cash = ended ? 0 : sourceCash * scale;
    const transfer = annuity + lumpSum + previousDividend;
    if (year <= 6) initialTransfers += transfer;
    const bonus = year < 6 ? 0 : (year === 6 ? initialTransfers : transfer) * data.transferFee;
    // 26.11 «利益演示» Y 列在当年扣除 V 列领取；L 列输入校验使用扣减前的余额。
    const beforeWithdrawal = (previousAccount + transfer - transfer * data.transferFee) * (1 + rate / 100) + bonus;
    const withdrawal = withdrawalByYear.get(year) ?? 0;
    const limit = beforeWithdrawal * (endAge < (sex === 'M' ? 60 : 55) ? 0.2 : 1);
    if (withdrawal > limit + 1e-7) {
      throw new Error(`第 ${year} 年的部分领取金额超过原表可演算上限（${limit.toLocaleString('zh-CN', { maximumFractionDigits: 2 })} 元）。`);
    }
    const account = Math.max(0, beforeWithdrawal - withdrawal);
    const accountCash = account * (1 - data.surrenderFees[Math.min(index, data.surrenderFees.length - 1)]);
    const nextBenefit = ended ? 0 : receive === endAge ? basic : (sourceRows[index + 1]?.[2] ?? 0) * scale;
    const survival = cash + accountCash + yearEndDividend + nextBenefit;
    paid += payment;
    payments.push(payment);
    const simpleDenominator = premium * (year * term - term * (term - 1) / 2);
    const row = {
      year, age: startAge, endAge, premium: payment, paid, annuity, lumpSum,
      dividend: previousDividend, yearEndDividend, cash, transfer, bonus, withdrawal, account, accountCash, survival,
      death: account + yearEndDividend + (ended ? 0 : sourceDeath * scale),
      simpleRate: survival >= paid && simpleDenominator ? (survival - paid) / simpleDenominator : null,
      irr: survival > paid ? annualizedReturn(payments, survival) : null,
    };
    previousDividend = yearEndDividend;
    previousAccount = account;
    return row;
  });
  if (!rows.every(row => Object.values(row).every(value => value === null || Number.isFinite(value) && Math.abs(value) <= Number.MAX_SAFE_INTEGER))) {
    throw new Error('这组输入超出了网页可演算的数值范围。');
  }
  return { input, rows, basic, factor, lumpAmount, totalPremium: paid };
}

function startLabel(age) {
  return age === 1 ? '生效后的首个年生效对应日' : `${age}岁后的首个年生效对应日`;
}

function sourceCell(model, sheet, address) {
  const [, col, row] = /^([A-Z]+)(\d+)$/.exec(address);
  return model.sheets[sheet].rows[Number(row) - 1]?.[columnNumber(col)] ?? null;
}

const cleanHeader = text => text.replace(/[\r\n]+/g, ' ').trim();

function suiteColumns(id, model) {
  if (id === 'xingfu') return COLUMNS;
  if (id === 'xingfu-b') return XINGFU_B_COLUMNS;
  const product = SUITE_PRODUCTS[id];
  const headers = model.sheets[product.sheet].rows[product.first - 2];
  return headers.slice(0, columnNumber(product.end) + 1).flatMap((label, index) => {
    if (typeof label !== 'string' || !label.trim() || label.includes('算IRR用')) return [];
    const key = String.fromCharCode(65 + index);
    const kind = [product.year, product.age, product.endAge].includes(key) ? 'integer'
      : product.account && product.withdrawals.some(item => item.cell === key) ? 'withdrawal'
      : /比例|增长率|单利|irr/i.test(label) ? 'percent' : undefined;
    const group = kind === 'integer' || /保费/.test(label) ? '基础信息'
      : /领取|红利|分红|年金|现价|现金价值/.test(label) ? '保单利益与领取' : '账户与总利益';
    return [{ key, label: cleanHeader(label), kind, group }];
  });
}

const eligibilityCache = new WeakMap();

function suiteCases(id, model) {
  if (eligibilityCache.has(model)) return eligibilityCache.get(model);
  const product = SUITE_PRODUCTS[id];
  const rows = product.life ? model.sheets['基本保额对应部分'].rows : model.sheets['基础数据'].rows;
  const cases = new Map();
  for (const row of rows) {
    if (row[5] !== 1 || !(row[7] > 0) || !Number.isInteger(row[4])) continue;
    const [term, code, age] = row.slice(2, 5);
    const sex = code === '男' ? 'M' : code === '女' ? 'F' : code;
    const start = product.startChoices ? row[1] : 0;
    if (!['M', 'F'].includes(sex)) continue;
    if (!cases.has(`${age}${sex}`)) cases.set(`${age}${sex}`, new Map());
    const terms = cases.get(`${age}${sex}`);
    if (!terms.has(term)) terms.set(term, new Set());
    terms.get(term).add(start);
  }
  eligibilityCache.set(model, cases);
  return cases;
}

function suiteChoices(id, model, age, sex, term) {
  if (SUITE_PRODUCTS[id].lumpPayout) return { terms: termsFor(model, age, sex), starts: payoutChoices(model, age, sex, term) };
  const terms = suiteCases(id, model).get(`${age}${sex}`) ?? new Map();
  return { terms: [...terms.keys()].sort((a, b) => a - b), starts: [...(terms.get(term) ?? [])].filter(Boolean).sort((a, b) => a - b) };
}

function planValue(engine, sheet, row, column) {
  try {
    const value = engine.cell(sheet, row - 1, columnNumber(column));
    return value === '' || value === '-' ? null : value;
  } catch (error) {
    if (!(error instanceof SheetError)) throw error;
    return null;
  }
}

const MAX_POLICY_YEARS = 106;

function expandWithdrawalStages(stages, product) {
  if (stages == null) return [];
  if (!product.account || !Array.isArray(stages) || stages.length > MAX_POLICY_YEARS) {
    throw new Error('请检查万能账户领取阶段。');
  }
  const [{ cell }] = product.withdrawals;
  const years = new Map();
  for (const [index, stage] of stages.entries()) {
    const { from, to, amount } = stage ?? {};
    if (!Number.isInteger(from) || !Number.isInteger(to) || from < 1 || to > MAX_POLICY_YEARS || to < from) {
      throw new Error(`请检查第 ${index + 1} 阶段的起止保单年度，结束年度须大于或等于开始年度。`);
    }
    if (!(amount > 0) || !Number.isSafeInteger(Math.round(amount * 100)) || Math.round(amount * 100) / 100 !== amount) {
      throw new Error(`请填写第 ${index + 1} 阶段的每年领取金额，最多两位小数。`);
    }
    for (let year = from; year <= to; year++) {
      if (years.has(year)) throw new Error(`领取阶段在第 ${year} 年重叠，请调整起止年度。`);
      years.set(year, { year, cell, amount });
    }
  }
  return [...years.values()].sort((a, b) => a.year - b.year);
}

function validateWithdrawals(withdrawals, product) {
  const used = new Set();
  return (withdrawals ?? []).filter(({ amount }) => amount !== 0).map(({ year, cell, amount }) => {
    const key = `${cell}${year}`;
    if (!Number.isInteger(year) || year < 1 || year > MAX_POLICY_YEARS || !product.withdrawals.some(item => item.cell === cell) ||
        !(amount > 0) || !Number.isSafeInteger(Math.round(amount * 100)) || used.has(key)) {
      throw new Error('请检查部分领取的保单年度、项目和金额。同一年度的同一项目只能填一次。');
    }
    used.add(key);
    return { year, cell, amount };
  });
}

function annualWithdrawals(input, product) {
  if (input.withdrawalStages != null) {
    if (input.withdrawals?.length) throw new Error('请选择一种部分领取填写方式。');
    return expandWithdrawalStages(input.withdrawalStages, product);
  }
  return validateWithdrawals(input.withdrawals, product);
}

function calculateSuite(id, model, input, columns = suiteColumns(id, model)) {
  const product = SUITE_PRODUCTS[id];
  const withdrawals = annualWithdrawals(input, product);
  if (id === 'xingfu') return { ...calculate(model, { ...input, withdrawals }), input };
  if (id === 'xingfu-b') {
    return { ...calculateXingfuB(model, input, withdrawals), productTitle: product.title, shortTitle: product.short,
      version: product.version, pdfNotes: RISK_NOTES };
  }
  const { age, sex, term, premium, rate, dividend, start } = input;
  const { terms, starts } = suiteChoices(id, model, age, sex, term);
  if (!terms.includes(term) || product.startChoices && !starts.includes(start)) {
    throw new Error('请选择原表支持的年龄、性别、缴费期间和领取方式。');
  }
  if (!(premium > 0) || !Number.isSafeInteger(Math.round(premium * 100))) throw new Error('请填写有效的首期保费。');
  if (!Number.isFinite(dividend) || dividend < 0) throw new Error('请填写有效的分红演示水平。');
  if (product.account && (!Number.isFinite(rate) || rate < product.account[0] || rate > product.account[1])) {
    throw new Error(`万能账户演示利率请输入 ${product.account[0]}% 至 ${product.account[1]}%。`);
  }
  const edits = {};
  for (const [key, address] of Object.entries(product.controls)) {
    edits[address] = key === 'sex' ? (sex === 'M' ? '男' : '女') : key === 'start' ? startLabel(start)
      : key === 'dividend' || key === 'rate' ? input[key] / 100 : input[key];
  }
  for (const { cell } of product.withdrawals) {
    for (let row = product.first; row < product.first + MAX_POLICY_YEARS; row++) edits[`${cell}${row}`] = 0;
  }
  for (const { year, cell, amount } of withdrawals) edits[`${cell}${product.first + year - 1}`] = amount;
  const engine = new Spreadsheet(model, { [product.sheet]: edits });
  const rows = [];
  for (let row = product.first; row < product.first + MAX_POLICY_YEARS; row++) {
    const year = planValue(engine, product.sheet, row, product.year);
    if (!(year > 0)) break;
    const values = Object.fromEntries(columns.map(({ key }) => [key, planValue(engine, product.sheet, row, key)]));
    rows.push({ ...values, year, age: planValue(engine, product.sheet, row, product.age),
      endAge: planValue(engine, product.sheet, row, product.endAge), annuity: product.annuity ? values[product.annuity] : 0 });
  }
  if (!rows.length) throw new Error('这组条件没有可生成的演算结果。');
  for (const item of withdrawals) {
    const config = product.withdrawals.find(rule => rule.cell === item.cell);
    const row = product.detailFirst + item.year - 1;
    const limit = config.limit ? planValue(engine, product.detail, row, config.limit) : undefined;
    const account = product.life ? undefined : planValue(engine, product.detail, row, 'Y');
    if (item.year > rows.length || config.limit && (!(limit >= 0) || item.amount > limit + 1e-7) ||
        !product.life && (typeof account !== 'number' || account < 0)) {
      throw new Error(`第 ${item.year} 年的「${config.label}」超过原表可演算范围。${typeof limit === 'number' ? `该项上限为 ${formatValue(limit)} 元。` : ''}`);
    }
  }
  const assumptions = [`分红演示水平 ${dividend}%`];
  if (product.account) assumptions.unshift(`账户演示利率 ${rate}%`);
  if (product.startChoices) assumptions.push(startLabel(start));
  return { input, rows, totalPremium: premium * term, productTitle: product.title, shortTitle: product.short,
    version: product.version, assumptions: assumptions.join('　'), notes: sourceCell(model, product.sheet, product.notes),
    pdfNotes: product.account ? RISK_NOTES : RISK_NOTES.slice(0, 2) };
}

const pdfType = 'application/pdf';

function canSharePdf(file) {
  if (typeof File !== 'function' || typeof navigator.share !== 'function' || typeof navigator.canShare !== 'function') return false;
  try {
    const sample = file ?? new File(['%PDF-1.7'], 'xingfu-plan.pdf', { type: pdfType });
    return navigator.canShare({ files: [sample] });
  } catch {
    return false;
  }
}

async function loadPdfForSharing(download, filename) {
  const response = await fetch(download, { cache: 'no-store', referrerPolicy: 'no-referrer' });
  if (!response.ok || response.headers.get('Content-Type')?.split(';')[0] !== pdfType) {
    throw new Error('无法取得 PDF 文件，请返回计划书页面重新生成。');
  }
  const header = response.headers.get('Content-Disposition') ?? '';
  const encodedName = /filename\*=UTF-8''([^;]+)/i.exec(header)?.[1];
  const name = encodedName ? pdfFilename(decodeURIComponent(encodedName), filename) : filename;
  return preparePdfFile(new Uint8Array(await response.arrayBuffer()), name);
}

function preparePdfFile(bytes, filename) {
  if (new TextDecoder().decode(bytes.slice(0, 5)) !== '%PDF-') throw new Error('取得的文件不是有效的 PDF。');
  const file = typeof File === 'function' ? new File([bytes], filename, { type: pdfType }) : null;
  return { blob: file ?? new Blob([bytes], { type: pdfType }), file, filename };
}

function sharePdf(file) {
  return navigator.share({ files: [file] });
}

function createPdfSharePage(download, filename) {
  const file = new URL(download);
  const page = new URL(file.pathname.startsWith('/api/suite/') ? '/six-pdf.html' : '/pdf-share.html', file.origin);
  for (const key of ['eo_token', 'eo_time']) {
    if (file.searchParams.has(key)) page.searchParams.set(key, file.searchParams.get(key));
  }
  // The gateway strips its own top-level query fields on redirect. The complete
  // PDF address also travels in a regular query field that survives the redirect.
  page.searchParams.set('file', file.pathname + file.search);
  page.hash = new URLSearchParams({ name: filename }).toString();
  return page;
}

function readPdfSharePage(href) {
  const page = new URL(href);
  const parameters = new URLSearchParams(page.hash.slice(1));
  const file = new URL(page.searchParams.get('file') ?? parameters.get('file') ?? '/', page.origin);
  if (file.origin !== page.origin || !/^\/api\/(?:plan-pdf|suite)\/save-[A-Za-z0-9_-]{39,5000}\.pdf$/.test(file.pathname)) {
    throw new Error('这个 PDF 链接不完整，请回到计划书页面重新生成。');
  }
  const filename = pdfFilename(parameters.get('name') ?? '');
  return { file, filename, page: createPdfSharePage(file.href, filename) };
}

function pdfFilename(name, fallback = '幸福享裕计划书.pdf') {
  return /^[\p{L}\p{N}_（）() -]{1,80}\.pdf$/u.test(name) ? name : fallback;
}

async function copyPdfAddress(address) {
  try {
    await navigator.clipboard.writeText(address.value);
    return '链接已复制，请粘贴到手机浏览器的地址栏打开。';
  } catch {
    address.hidden = false;
    address.focus();
    address.select();
    return '请长按复制选中的完整链接，再粘贴到手机浏览器打开。';
  }
}

const element = id => document.getElementById(id);
const bundles = JSON.parse(element('suite-data').textContent);
const hosted = bundles.hosted === true;
const selectedByProduct = new Map();
const productSelect = element('product');
const state = { id: 'xingfu', model: null, columns: [], plan: null, pdf: null, pdfFile: null, exportVersion: 0, loadVersion: 0, submitVersion: 0 };
const current = () => SUITE_PRODUCTS[state.id];

function create(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function message(id, text) {
  const node = element(id);
  node.textContent = text;
  node.hidden = !text;
}

function options(select, values, label, preferred) {
  select.replaceChildren(...values.map(value => {
    const option = create('option', label(value));
    option.value = value;
    return option;
  }));
  if (values.includes(preferred)) select.value = String(preferred);
  select.disabled = !values.length;
}

function recommend() {
  const choices = state.id === 'xingfu' ? [...DEFAULT_COLUMNS] : current().defaults.split(' ');
  if (current().lumpPayout && Number(element('start').value)) choices.splice(choices.indexOf('annuity') + 1, 0, 'lumpSum');
  if (current().account &&
      [...element('withdrawal-stages').querySelectorAll('[data-withdrawal-amount]')].some(input => input.valueAsNumber > 0)) {
    choices.push(current().withdrawals[0].cell);
  }
  return choices;
}

function selectedColumns() {
  const selected = new Set(selectedByProduct.get(state.id) ?? recommend());
  return state.columns.filter(column => selected.has(column.key));
}

function updateSelection() {
  const selected = selectedColumns();
  element('selected-summary').textContent = `已选 ${selected.length} 项 · ${selected.map(column => column.label).join('、')}`;
}

function updateAmounts() {
  const premium = element('premium').valueAsNumber;
  const term = Number(element('term').value);
  element('total').textContent = Number.isFinite(premium) && premium > 0 && term > 0 ? `${formatValue(premium * term)} 元` : '—';
  for (const button of document.querySelectorAll('[data-premium]')) {
    button.setAttribute('aria-pressed', String(Number(button.dataset.premium) === premium));
  }
}

function choicesFor(age, sex, term) {
  if (!hosted) return suiteChoices(state.id, state.model, age, sex, term);
  const options = bundles.products[state.id].eligibility[`${age}${sex}`] ?? {};
  return { terms: Object.keys(options).map(Number), starts: options[term] ?? [] };
}

function updateChoices(preferredTerm = Number(element('term').value), preferredStart = Number(element('start').value)) {
  const age = element('age').valueAsNumber;
  const sex = element('sex').value;
  const { terms } = choicesFor(age, sex, preferredTerm);
  options(element('term'), terms, termLabel, preferredTerm);
  element('term-help').textContent = terms.length ? `可选 ${terms.map(termLabel).join('、')}` : '该年龄和性别在此版本中没有可选缴费期间。';
  const { lumpPayout, startChoices } = current();
  const showStart = lumpPayout || startChoices;
  const { starts } = choicesFor(age, sex, Number(element('term').value));
  element('start-field').hidden = !showStart;
  element('start-label').textContent = lumpPayout ? '一次性领取年龄' : '年金起领方式';
  options(element('start'), lumpPayout ? [0, ...starts] : starts,
    value => lumpPayout ? (value ? `${value} 岁` : '未设计') : startLabel(value), preferredStart);
  message('start-help', showStart ? (starts.length ? '按当前年龄、性别和缴费期间筛选。' : '当前条件没有可选领取年龄。') : '');
  element('generate').disabled = !terms.length || !!current().startChoices && !starts.length;
  updateAmounts();
  updateSelection();

function fillExample() {

function clearPdf() {
  state.exportVersion++;

  state.pdfFile = null;
  element('save-pdf').removeAttribute('href');

function showForm() {
  element('form-view').hidden = false;

}

async function loadProduct(id) {
  const version = ++state.loadVersion;
  element('form-view').hidden = true;
  element('preview-view').hidden = true;
  state.plan = null;
  clearPdf();
  message('load-status', '正在载入本版本演算数据…');
  try {
    let model;
    if (!hosted) {
      const bytes = Uint8Array.from(atob(bundles[id]), char => char.charCodeAt(0));
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      model = await new Response(stream).json();
    }
    if (version !== state.loadVersion) return;
    state.id = id;
    state.model = model;
    state.columns = hosted ? bundles.products[id].columns : suiteColumns(id, model);
    const heading = element('product-title');
    const title = current().title;
    const productType = '保险产品计划';
    if (title.endsWith(productType)) {
      heading.replaceChildren(title.slice(0, -productType.length), create('span', productType, 'product-type'));
    } else {
      heading.textContent = title;
    }
    fillExample();
    message('load-status', '');
    showForm();
  } catch {
    if (version === state.loadVersion) message('load-status', hosted ? '无法载入产品，请刷新网页重试。' : '无法载入。请用新版 Chrome 或 Edge 打开这个本地文件。');
  }
}

function readInputs() {
  const withdrawals = [...element('withdraw-list').children].flatMap(row => {
    const [year, item, amount] = row.querySelectorAll('input,select');
    return year.value || amount.value ? [{ year: year.valueAsNumber, cell: item.value, amount: amount.valueAsNumber }] : [];
  });
  const withdrawalStages = [...element('withdrawal-stages').children].map(row => {
    const [from, to, amount] = row.querySelectorAll('input');
    return { from: from.valueAsNumber, to: to.valueAsNumber, amount: amount.valueAsNumber };

  const receive = Number(element('start').value);
  return { age: element('age').valueAsNumber, sex: element('sex').value, term: Number(element('term').value),
    premium: element('premium').valueAsNumber, dividend: element('dividend').valueAsNumber,
    rate: element('rate').valueAsNumber, start: receive, receive,

  const withdrawalYears = plannedWithdrawalYears(plan.input);
  element('plan-body').replaceChildren(...plan.rows.map(row => {
    const tr = create('tr', undefined, row.lumpSum || row.year === firstAnnuity || withdrawalYears.has(row.year) ? 'key-year' : '');
    for (const column of columns) {
      const className = column.key === yearKey ? 'policy-year' :
        column.kind === 'withdrawal' && row[column.key] > 0 ? 'withdrawal-value' : undefined;
      tr.append(create('td', formatValue(row[column.key], column.kind), className));
    }
    return tr;
  }));
  element('plan-notes').textContent = plan.notes ?? RISK_NOTES.join('\n');
  element('form-view').hidden = true;
  element('preview-view').hidden = false;
}

const dialog = element('settings');
function markChoices(keys) {
  const set = new Set(keys);
  for (const checkbox of element('column-choices').querySelectorAll('input')) checkbox.checked = set.has(checkbox.value);
}

function openSettings() {
  element('settings-product').textContent = `${current().title} · ${current().version}`;
  message('settings-error', '');
  const groups = new Map();
  for (const column of state.columns) {
    if (!groups.has(column.group)) groups.set(column.group, []);
    groups.get(column.group).push(column);
  }
  element('column-choices').replaceChildren(...[...groups].map(([title, columns]) => {
    const section = create('section');
    section.append(create('h3', title, 'suite-label'));
    const list = create('div', undefined, 'suite-choices');
    for (const column of columns) {
      const label = create('label');
      const checkbox = create('input');
      checkbox.type = 'checkbox';
      checkbox.value = column.key;
      label.append(checkbox, document.createTextNode(column.label));
      list.append(label);
    }
    section.append(list);
    return section;
  }));
  markChoices(selectedColumns().map(column => column.key));
  dialog.showModal();
}

function addWithdrawal() {
  const line = create('div', undefined, 'suite-withdraw');
  const year = create('input');
  Object.assign(year, { type: 'number', min: 1, max: 106, step: 1, placeholder: '保单年度' });
  year.setAttribute('aria-label', '领取保单年度');
  const type = create('select');
  type.setAttribute('aria-label', '领取项目');
  options(type, current().withdrawals.map(item => item.cell), value => current().withdrawals.find(item => item.cell === value).label);
  const amount = create('input');
  Object.assign(amount, { type: 'number', min: 0, step: 0.01, placeholder: '金额（元）' });
  amount.setAttribute('aria-label', '领取金额（元）');
  const remove = create('button', '删除');
  remove.type = 'button';
  remove.addEventListener('click', () => line.remove());
  line.append(year, type, amount, remove);
  element('withdraw-list').append(line);
  year.focus();
}

function updateWithdrawalStages() {
  message('form-error', '');
  for (const [index, row] of [...element('withdrawal-stages').children].entries()) {
    const title = `领取阶段 ${index + 1}`;
    row.querySelector('h3').textContent = title;
    row.querySelector('button').setAttribute('aria-label', `删除${title}`);
  }
  updateSelection();
}

function addWithdrawalStage() {
  const list = element('withdrawal-stages');
  const selected = selectedByProduct.get(state.id);
  const withdrawalColumn = current().withdrawals[0].cell;
  if (!list.children.length && selected && !selected.includes(withdrawalColumn)) {
    selectedByProduct.set(state.id, [...selected, withdrawalColumn]);
  }
  const row = create('div', undefined, 'withdrawal-stage');
  const header = create('div', undefined, 'withdrawal-stage-header');
  const remove = create('button', '删除', 'text-button');
  remove.type = 'button';
  remove.addEventListener('click', () => {
    row.remove();
    updateWithdrawalStages();
  });
  header.append(create('h3'), remove);
  row.append(header);
  for (const [label, amount] of [['开始年度', false], ['结束年度', false], ['每年领取金额（元）', true]]) {
    const field = create('label', label);
    const input = create('input');
    Object.assign(input, { type: 'number', required: true, min: amount ? 0.01 : 1, step: amount ? 0.01 : 1 });
    input.inputMode = amount ? 'decimal' : 'numeric';
    if (amount) {
      input.dataset.withdrawalAmount = '';
      input.addEventListener('input', updateSelection);
    } else {
      input.max = MAX_POLICY_YEARS;
    }
    field.append(input);
    row.append(field);
  }
  list.append(row);
  updateWithdrawalStages();
  row.querySelector('input').focus();
}

productSelect.replaceChildren(...Object.keys(hosted ? bundles.products : bundles).map(id => {
  const config = SUITE_PRODUCTS[id];
  const option = create('option', `${config.short} · ${config.version}`);
  option.value = id;
  return option;
}));
productSelect.disabled = false;
productSelect.addEventListener('change', () => loadProduct(productSelect.value));
element('sample').addEventListener('click', fillExample);
for (const id of ['age', 'sex', 'term']) element(id).addEventListener('input', () => updateChoices());
element('start').addEventListener('input', updateSelection);
element('premium').addEventListener('input', updateAmounts);
for (const button of document.querySelectorAll('[data-premium]')) button.addEventListener('click', () => {
  element('premium').value = button.dataset.premium;
  updateAmounts();
});
element('add-withdrawal').addEventListener('click', addWithdrawal);
element('add-withdrawal-stage').addEventListener('click', addWithdrawalStage);
element('withdrawal-stages').addEventListener('input', () => message('form-error', ''));
element('withdrawal-schedule').addEventListener('focusin', event => {
  const control = event.target;
  const actions = element('generate').closest('.form-actions');
  if (getComputedStyle(actions).position === 'sticky') {
    const overlap = control.getBoundingClientRect().bottom - actions.getBoundingClientRect().top;
    if (overlap > 0) window.scrollBy(0, overlap + 8);
  }
});
element('back').addEventListener('click', showForm);
for (const id of ['form-settings', 'preview-settings']) element(id).addEventListener('click', openSettings);
element('select-all').addEventListener('click', () => markChoices(state.columns.map(column => column.key)));
element('select-default').addEventListener('click', () => markChoices(recommend()));
element('cancel-settings').addEventListener('click', () => dialog.close());
element('apply-settings').addEventListener('click', () => {
  const keys = [...element('column-choices').querySelectorAll('input:checked')].map(input => input.value);
  if (!keys.length) { message('settings-error', '请至少选择一个展示项目。'); return; }
  selectedByProduct.set(state.id, keys);
  updateSelection();
  dialog.close();
  if (!element('preview-view').hidden) renderPreview();
});
async function suiteRequest(action, data) {
  const response = await fetch(`/api/suite/${action}`, {
    method: 'POST', cache: 'no-store',
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data),
  });
  if (response.status === 401) throw new Error('试用链接缺少校验参数或已到期，请从微信聊天打开完整试用链接。');
  if (!response.headers.get('Content-Type')?.includes('application/json')) throw new Error('暂时无法连接演算服务，请稍后再试。');
  const result = await response.json();
  if (!response.ok) throw new Error(result.error ?? '暂时无法处理，请稍后再试。');
  return result;
}

element('plan-form').addEventListener('submit', async event => {
  event.preventDefault();
  const load = state.loadVersion;
  const submit = ++state.submitVersion;
  const button = element('generate');
  message('form-error', '');
  if (hosted) { button.disabled = true; button.textContent = '正在演算…'; }
  try {
    const input = readInputs();
    const plan = hosted ? await suiteRequest('plan', { product: state.id, input }) : calculateSuite(state.id, state.model, input, state.columns);
    if (load !== state.loadVersion || submit !== state.submitVersion) return;
    state.plan = plan;
    renderPreview();
    window.scrollTo(0, 0);
  } catch (error) {
    if (load === state.loadVersion && submit === state.submitVersion) {
      message('form-error', error instanceof TypeError ? '暂时无法演算，请检查网络后重试。' : error.message);
    }
  } finally {
    if (hosted && submit === state.submitVersion) {
      button.textContent = '生成计划书';
      if (load === state.loadVersion) button.disabled = !element('term').value || !!current().startChoices && !element('start').value;
    }
  }
});

const inWeChat = hosted && /MicroMessenger/i.test(navigator.userAgent);
element('share-pdf').addEventListener('click', async () => {
  try { await sharePdf(state.pdfFile); }
  catch (error) {
    if (error.name !== 'AbortError') message('pdf-status', '当前浏览器无法打开文件分享，请点「保存或转发 PDF」继续。');
  }
});

element('export').addEventListener('click', async () => {
  const version = ++state.exportVersion;
  const plan = state.plan;
  const columns = visiblePdfColumns(selectedColumns(), plan.rows);
  if (!columns.length) {
    message('pdf-status', EMPTY_PDF_COLUMNS);
    return;
  }
  element('export').disabled = true;
  message('pdf-status', '正在生成 PDF…');
  try {
    const filename = planPdfFilename(plan);
    const result = hosted ? await suiteRequest(canSharePdf() ? 'file' : 'link', {
      product: state.id, input: plan.input, columns: columns.map(column => column.key),
    }) : await exportPlanPdf(plan, columns, plan.rows);
    if (version !== state.exportVersion) return;
    const save = element('save-pdf');
    if (hosted) {
      const download = new URL(result.download, location.href);
      save.href = inWeChat ? createPdfSharePage(download.href, filename).href : download.href;
      if (inWeChat) { save.removeAttribute('download'); save.textContent = '保存或转发 PDF'; }
      else save.download = filename;
      if (result.pdf) {
        const { file } = preparePdfFile(Uint8Array.from(atob(result.pdf), char => char.charCodeAt(0)), filename);
        if (file && canSharePdf(file)) {
          state.pdfFile = file;
          element('share-pdf').hidden = false;
        }
      }
    } else {
      state.pdf = URL.createObjectURL(new Blob([result], { type: 'application/pdf' }));
      save.href = state.pdf;
      save.download = filename;
    }
    element('pdf-info').textContent = `PDF 已生成 · ${plan.rows.length} 行 · ${columns.length} 项`;
    element('pdf-actions').hidden = false;
    message('pdf-status', '');
  } catch (error) {
    if (version === state.exportVersion) {
      message('pdf-status', hosted && !(error instanceof TypeError) ? error.message : 'PDF 生成失败，请再试一次。');
    }
  } finally {
    if (version === state.exportVersion) element('export').disabled = !hosted && !!state.pdf;
  }
});
loadProduct(productSelect.value);
</script>
</body>
</html>
